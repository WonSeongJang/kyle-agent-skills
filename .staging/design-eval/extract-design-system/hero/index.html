<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rottie / Extracted Terminal</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--surface:oklch(19% .016 160);--raised:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--accent:oklch(80% .17 150);--info:oklch(78% .10 220);--line:oklch(32% .02 160/.55)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}main{min-height:100svh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:clamp(24px,5vw,72px);padding:clamp(24px,6vw,80px)}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.16em}h1{font-size:clamp(50px,7vw,98px);line-height:.9;letter-spacing:-.06em;margin:24px 0}p{max-width:600px;color:var(--dim);font:17px/1.65 -apple-system,"Apple SD Gothic Neo",sans-serif}.actions{display:flex;gap:8px;margin-top:28px}.actions a{padding:12px 16px;border:1px solid var(--line);border-radius:4px;color:var(--text);text-decoration:none;font-size:13px}.actions a:first-child{background:var(--accent);color:#0d160f;border-color:var(--accent);font-weight:800}a:focus-visible{outline:2px solid var(--info);outline-offset:3px}.flow{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px}.flow header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--dim)}.flow header b{color:var(--accent)}.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{color:var(--accent)}.row small{color:var(--dim)}.row i{font-style:normal;color:var(--info)}@media(max-width:720px){main{grid-template-columns:1fr;align-content:start}.actions{flex-wrap:wrap}.flow{margin-top:16px}.row{grid-template-columns:44px 1fr}.row i{grid-column:2}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><section><div class="eyebrow">ROTTIE / DESKTOP AI IDE</div><h1>생각이 끊기기 전에,<br>코드까지.</h1><p>파일을 찾고, 명령을 실행하고, AI와 고친다. 흩어진 개발 작업을 한 창에 잇습니다.</p><nav class="actions"><a href="#flow">Rottie 시작하기</a><a href="#flow">작업 흐름 보기</a></nav></section><section class="flow" id="flow"><header><span>WORKFLOW / CURRENT</span><b>READY</b></header><div class="row"><b>FILE</b><span>Editor.tsx</span><i>OPEN</i></div><div class="row"><b>TERM</b><span>npm run tauri:dev</span><i>PASS</i></div><div class="row"><b>AI</b><span>선택 영역 문맥</span><i>ATTACHED</i></div></section></main></body></html>
