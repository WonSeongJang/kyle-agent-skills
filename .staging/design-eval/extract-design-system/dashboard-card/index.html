<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extracted Run Card</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--surface:oklch(19% .016 160);--raised:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--accent:oklch(80% .17 150);--warn:oklch(80% .13 85);--danger:oklch(72% .15 25);--info:oklch(78% .10 220);--line:oklch(32% .02 160/.55)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:13px/1.55 ui-monospace,monospace}.card{width:min(720px,100%);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.head small{color:var(--dim)}h1{font-size:16px;margin:4px 0}.active{color:var(--accent)}.workers{display:grid;gap:4px;margin:16px 0}.worker{display:grid;grid-template-columns:12px 1fr auto;gap:8px;padding:12px;background:var(--raised);border-radius:4px}.worker i{width:8px;height:8px;margin-top:5px;background:var(--accent)}.worker:nth-child(2) i{background:var(--info)}.worker:nth-child(3) i{background:var(--warn)}.worker span{color:var(--dim)}.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.signal{background:var(--raised);padding:12px;border-top:2px solid var(--line)}.signal b{display:block;font-size:22px}.signal:nth-child(1){border-color:var(--warn)}.signal:nth-child(1) b{color:var(--warn)}.signal:nth-child(2){border-color:var(--danger)}.signal:nth-child(2) b{color:var(--danger)}.signal:nth-child(3){border-color:var(--accent)}.signal:nth-child(3) b{color:var(--accent)}.card:focus-visible{outline:2px solid var(--info);outline-offset:4px}@media(max-width:500px){.signals{grid-template-columns:1fr}.signal{display:flex;justify-content:space-between}.head{gap:12px}}@media(prefers-reduced-motion:reduce){*{transiti
