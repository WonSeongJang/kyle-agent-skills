<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emil Ops</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:13px ui-monospace,monospace}.card{width:min(720px,100%);background:var(--card);border:1px solid #3b463f;border-radius:10px;padding:20px;box-shadow:0 30px 80px #0007;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s}.card:hover{transform:translateY(-3px);border-color:#607067}.card:active{transform:scale(.995)}.head{display:flex;justify-content:space-between;align-items:center}.head small{color:var(--dim)}.head h1{font-size:16px;margin:5px 0}.live{color:var(--ok);display:flex;align-items:center;gap:7px}.live i{width:8px;height:8px;background:var(--ok);border-radius:50%;box-shadow:0 0 0 4px oklch(80% .17 150/.1)}.list{display:grid;gap:7px;margin:18px 0}.row{display:grid;grid-template-columns:1fr auto;background:var(--inner);border-radius:6px;padding:12px;transition:background .15s}.row:hover{background:oklch(27% .02 160)}.row span{color:var(--dim)}.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.signal{padding:12px;border:1px solid #3b463f;border-radius:6px;color:var(--dim)}.signal b{display:block;color:var(--text);font-size:20px;margin-top:5px}.signal:nth-child(1) b{color:var(--warn)}.signal:nth-child(2) b{color:var(--bad)}.signal:nth-child(3) b{color:var(--ok)}.card:focus-visible{outline:2px solid var(--ok);outline-offset:4px}@media(max-width:520px){body{padding:12px}.head{align-items:start}.live{font-size:0}.signals{grid-template-columns:1fr}.signal{display:flex;justify-content:space-between;align-items:center}
