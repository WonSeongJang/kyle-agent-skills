<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interaction Polish</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#111513;color:#eef4ef;font-family:-apple-system,sans-serif;padding:24px}.demo{width:min(560px,100%)}h1{font-size:42px;letter-spacing:-.05em;margin:0 0 12px}p{color:#9aa69f;line-height:1.6}.stack{margin-top:32px;display:grid;gap:12px}.action{appearance:none;width:100%;border:1px solid #354039;background:#1b211e;color:inherit;border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;text-align:left;font:600 15px inherit;box-shadow:0 0 0 #0000;transition:transform .16s cubic-bezier(.2,.8,.2,1),background .16s,box-shadow .16s}.action span{color:#8ce7a4;font:13px ui-monospace,monospace}.action:hover{background:#222b26;transform:translateY(-2px);box-shadow:0 8px 22px #0005}.action:active{transform:translateY(0) scale(.98);box-shadow:0 2px 5px #0005}.action:focus-visible{outline:2px solid #8ce7a4;outline-offset:3px}.status{margin-top:16px;min-height:48px;border-left:2px solid #8ce7a4;padding:8px 12px;color:#c5d1c9;font:13px/1.5 ui-monospace,monospace}.done{animation:settle .36s cubic-bezier(.2,.8,.2,1)}@keyframes settle{0%{transform:translateY(5px);opacity:.3}100%{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="demo"><h1>작은 반응이<br>신뢰를 만든다.</h1><p>같은 동작도 hover, focus, press, 완료 상태가 이어지면 사용자는 지금 무슨 일이 일어나는지 놓치지 않는다.</p><section class="stack"><button class="action" data-msg="파일 문맥을 붙였습니다."><b>현재 파일 붙이기</b><span>⌘1</span></button><button class="action" data-msg="마지막 터미널 오류를 붙였습니다."><b>실행 오류 붙이기</b><span>⌘2</span></button><button class="action" data-msg="수정 범위를 하나로 좁혔습니다."><b>수정안 준비</b><span>⌘↵</span></button></section><div id="status" class="status" role="status">버튼을 눌러 상태 연결을 확인하세요.</div></main><script>const s=document.querySelector("#status");document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>{s.classList.remove("done");s.textContent=b.dataset.msg;requestAnimationFrame(()=>s.classList.add("done"))}))</script></body></html>
