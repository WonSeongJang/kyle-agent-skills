<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rottie Command Atlas</title><style>*{box-sizing:border-box}body{margin:0;background:#132019;color:#ecf1e8;font-family:Arial,sans-serif}main{min-height:100svh;display:grid;grid-template-columns:350px 1fr}.intro{padding:42px;background:#eff0e7;color:#142018}.intro small{font:11px ui-monospace,monospace}.intro h1{font:400 58px/.9 Georgia,serif;letter-spacing:-.05em;margin:30px 0}.intro p{line-height:1.6}.atlas{padding:42px;display:grid;grid-template-columns:repeat(2,1fr);align-content:center;gap:12px}.command{border:1px solid #4e6255;padding:22px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,transform .15s}.command:hover{background:#203128;transform:translateY(-2px)}.command b{font:700 12px ui-monospace,monospace;color:#aaf485}.command h2{font:400 30px Georgia,serif}.command kbd{align-self:end;background:#eff0e7;color:#142018;padding:8px 10px;border-radius:2px}.command:focus-visible{outline:3px solid #f37547;outline-offset:3px}@media(max-width:760px){main{grid-template-columns:1fr}.intro{padding:26px}.intro h1{font-size:46px}.atlas{grid-template-columns:1fr;padding:20px}.command{min-height:140px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><section class="intro"><small>ROTTIE / COMMAND ATLAS</small><h1>네 번의 이동,<br>한 번의 흐름.</h1><p>제품 특유의 명령 중심 사용법을 메뉴가 아니라 큰 조작 지도처럼 보여주는 실험이다.</p></section><section class="atlas"><article class="command" tabindex="0"><b>01 / FIND</b><h2>파일을 찾는다</h2><kbd>⌘P</kbd></article><article class="command" tabindex="0"><b>02 / RUN</b><h2>명령을 실행한다</h2><kbd>⌃`</kbd></article><article class="command" tabindex="0"><b>03 / ASK</b><h2>선택 영역을 묻는다</h2><kbd>⌘L</kbd></article><article class="command" tabindex="0"><b>04 / FIX</b><h2>저장하고 검증한다</h2><kbd>⌘S</kbd></article></section></main></body></html>
