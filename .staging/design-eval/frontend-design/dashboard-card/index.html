<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontend Design Card</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25);--cyan:oklch(78% .10 220)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:13px ui-monospace,monospace}.card{width:min(760px,100%);background:var(--card);border:1px solid #435047;padding:0}.banner{display:flex;justify-content:space-between;align-items:center;background:var(--ok);color:#0d160f;padding:11px 16px;font-weight:900;letter-spacing:.08em}.main{padding:20px}.main h1{font:400 30px/1 Georgia,serif;margin:10px 0 20px}.main small{color:var(--dim)}.workers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.worker{min-height:130px;background:var(--inner);padding:14px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:4px solid var(--cyan)}.worker:nth-child(2){border-color:var(--ok)}.worker:nth-child(3){border-color:var(--warn)}.worker span{color:var(--dim)}.signals{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #435047;margin-top:16px}.signal{padding:15px;border-right:1px solid #435047}.signal:last-child{border:0}.signal b{float:right;font-size:20px}.signal:nth-child(1) b{color:var(--warn)}.signal:nth-child(2) b{color:var(--bad)}.signal:nth-child(3) b{color:var(--ok)}.card:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}@media(max-width:560px){.workers{grid-template-columns:1fr}.worker{min-height:88px}.signals{grid-template-columns:1fr}.signal{border-right:0;border-bottom:1px solid #435047}.main h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><article class="card" tabindex="0"><header class="banner"><span>RUN / DESIGN-SKILL-EVAL</span><span>3 / 5 ACTIVE</span></header><div class="main"><small>관제 중인 작업자</small><h1>Three makers, one clear signal.</h1><section class="workers"><div class="worker"><b>frontend-design</b><span>LANDING HERO</span></div><div class="worker"><b>canvas-design</b><span>POSTER</span></div><div class="worker"><b>web-design-reviewer</b><span>VISUAL AUDIT</span></div></section><section class="signals"><div class="signal">검수 대기<b>2</b></div><div class="signal">경고<b>1</b></div><div class="signal">완료<b>7</b></div></section></div></article></body></html>
