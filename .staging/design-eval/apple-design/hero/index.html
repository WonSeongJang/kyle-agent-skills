<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rottie / Fluid</title><style>
:root{--bg:#f5f5f3;--ink:#121311;--blue:#296bd6;--glass:#ffffffb8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8f8f5,#e9ece8);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:clamp(20px,5vw,64px)}.shell{width:min(1240px,100%);display:grid;grid-template-columns:1fr 1fr;gap:62px;align-items:center}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:#61665f}h1{font-size:clamp(54px,7.5vw,104px);line-height:.92;letter-spacing:-.065em;margin:24px 0}p{font-size:19px;line-height:1.58;color:#5e635e;max-width:570px}.actions{display:flex;gap:10px;margin-top:30px}.actions a{padding:13px 17px;border-radius:999px;background:#e2e5e1;color:inherit;text-decoration:none;font-weight:650;transition:transform .45s linear(0,.015,.057,.12,.21,.34,.48,.62,.74,.84,.91,.96,.985,1)}.actions a:first-child{background:var(--ink);color:white}.actions a:hover{transform:scale(1.035)}.actions a:active{transform:scale(.95)}a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.stage{height:590px;position:relative;display:grid;place-items:center}.orb{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9ef1c2,#80b4f4 48%,#9c82e7)}.window{position:relative;width:86%;height:70%;background:var(--glass);backdrop-filter:blur(24px);border:1px solid #ffffffc9;border-radius:26px;box-shadow:0 34px 90px #263e3440;padding:20px;transform:rotate(-3deg);transition:transform .8s linear(0,.011,.041,.085,.16,.26,.39,.53,.66,.77,.86,.93,.975,1)}.window:hover{transform:rotate(0) scale(1.025)}.bar{display:flex;justify-content:space-between;color:#6a716a;font:12px ui-monospace,monospace}.flow{display:grid;gap:10px;margin-top:42px}.flow div{padding:16px;border-radius:15px;background:#fff9;display:flex;justify-content:space-between}.flow b{color:var(--blue)}@media(max-width:760px){main{padding:14px}.shell{grid-template-columns:1fr;gap:16px}.stage{height:310px}.orb{width:245px;height:245px}.window{height:76%;padding:14px}h1{font-size:50px;margin:14px 0}p{font-size:14px}.actions{flex-wrap:wrap;margin-top:14px}.actions a{padding:10px 12px}.flow{margin-top:20px}.flow div{padding:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.window{transform:none}}</style></head><body><main><div class="shell"><section><div class="eyebrow">ROTTIE / DESKTOP AI IDE</div><h1>생각이 끊기기 전에,<br>코드까지.</h1><p>파일을 찾고, 명령을 실행하고, AI와 고친다. 흩어진 개발 작업을 한 창에 잇습니다.</p><nav class="actions"><a href="#flow">Rottie 시작하기</a><a href="#flow">작업 흐름 보기</a></nav></section><section class="stage" id="flow"><div class="orb"></div><div class="window"><div class="bar"><span>ROTTIE</span><span>LOCAL</span></div><div class="flow"><div>파일 열기 <b>⌘P</b></div><div>터미널 실행 <b>⌃`</b></div><div>AI에 붙이기 <b>⌘L</b></div></div></div></section></div></main></body></html>
