<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interruptible Panel</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#e9ece9;color:#141613;font-family:-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.phone{width:min(430px,100%);height:720px;border-radius:42px;background:#fafbf9;box-shadow:0 30px 100px #26382c38;position:relative;overflow:hidden;padding:28px}.phone h1{font-size:38px;letter-spacing:-.05em}.phone p{color:#667067;line-height:1.55}.open{border:0;border-radius:999px;background:#161a17;color:white;padding:13px 18px;font-weight:700}.open:focus-visible,.sheet button:focus-visible{outline:3px solid #3478db;outline-offset:3px}.sheet{position:absolute;inset:auto 10px 10px;background:#ffffffdd;backdrop-filter:blur(22px);border:1px solid white;border-radius:30px;padding:22px;box-shadow:0 24px 60px #26382c38;transform:translateY(calc(100% + 20px));transition:transform .7s linear(0,.012,.045,.1,.18,.29,.43,.57,.7,.81,.9,.96,.99,1);touch-action:none}.sheet.opened{transform:translateY(0)}.handle{width:44px;height:5px;border-radius:99px;background:#c2c8c2;margin:0 auto 20px}.sheet button{width:100%;padding:14px;border:0;border-radius:13px;background:#e8ece8;font-weight:650;margin-top:8px}.sheet button.primary{background:#2271e6;color:white}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}</style></head><body><main class="phone"><small>ROTTIE / CURRENT FILE</small><h1>Editor.tsx</h1><p>선택한 코드와 마지막 실행 오류를 같은 문맥으로 묶습니다.</p><button class="open" id="open">AI 작업 열기</button><section class="sheet" id="sheet" aria-label="AI 작업" aria-hidden="true"><div class="handle"></div><h2>이 문맥으로 무엇을 할까요?</h2><p>아래 패널은 열리는 중에도 다시 눌러 방향을 바꿀 수 있고, 키보드로도 닫을 수 있습니다.</p><button class="primary">수정안 만들기</button><button id="close">닫기</button></section></main><script>const s=document.querySelector("#sheet"),o=document.querySelector("#open"),c=document.querySelector("#close");function set(v){s.classList.toggle("opened",v);s.setAttribute("aria-hidden",String(!v));if(v)c.focus();else o.focus()}o.onclick=()=>set(!s.classList.contains("opened"));c.onclick=()=>set(false);document.addEventListener("keydown",e=>{if(e.key==="Escape")set(false)})</script></body></html>
