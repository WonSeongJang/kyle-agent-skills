<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluid Ops</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,oklch(23% .025 160),var(--bg));color:var(--text);font:13px ui-monospace,monospace}.card{width:min(720px,100%);background:oklch(19% .016 160/.82);backdrop-filter:blur(20px);border:1px solid #ffffff20;border-radius:18px;padding:20px;box-shadow:0 35px 90px #0008;transition:transform .65s linear(0,.015,.055,.12,.22,.36,.51,.66,.78,.88,.95,.985,1)}.card:hover{transform:scale(1.012)}.head{display:flex;justify-content:space-between;align-items:center}.head small{color:var(--dim)}h1{font-size:16px}.status{background:oklch(80% .17 150/.12);color:var(--ok);padding:7px 10px;border-radius:99px}.workers{display:grid;gap:8px;margin:16px 0}.worker{display:flex;justify-content:space-between;padding:13px 14px;background:var(--inner);border-radius:12px;transition:transform .5s linear(0,.02,.08,.18,.33,.5,.67,.82,.92,.98,1),background .2s}.worker:hover{transform:translateX(5px);background:oklch(27% .02 160)}.worker span{color:var(--dim)}.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.signal{padding:13px;background:#ffffff0a;border-radius:12px}.signal b{font-size:22px;display:block;margin-top:5px}.signal:nth-child(1) b{color:var(--warn)}.signal:nth-child(2) b{color:var(--bad)}.signal:nth-child(3) b{color:var(--ok)}.card:focus-visible{outline:3px solid var(--ok);outline-offset:4px}@media(max-width:500px){.signals{grid-template-columns:1fr}.signal{display:flex;justify-content:space-between}.signal b{margin:0}.status{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><article class="card" tabindex="0"><header class="head"><div><small>RUN / design-skill-eval</small><h1>디자인 평가 실행</h1></div><span class="status">3 / 5 active</span></header><section class="workers"><div class="worker"><b>frontend-design</b><span>hero</span></div><div class="worker"><b>canvas-design</b><span>poster</span></div><div class="worker"><b>web-design-reviewer</b><span>audit</span></div></section><section class="signals"><div class="signal">검수 대기<b>2</b></div><div class="signal">경고<b>1</b></div><div class="signal">완료<b>7</b></div></section></article></body></html>
