<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rottie Launch Deck</title><style>
:root{--bg:#0d1711;--panel:#17251c;--text:#edf1e8;--muted:#9baaa0;--green:#9ef48d;--orange:#f0874a;--cyan:#64b6a5}
*{box-sizing:border-box}body{margin:0;background:#050806;font-family:Arial,"Apple SD Gothic Neo",sans-serif}.deck{display:grid;gap:30px;padding:30px}.slide{width:1600px;height:900px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;padding:76px 86px;display:flex;flex-direction:column}.num{font:20px ui-monospace,monospace;color:var(--green);letter-spacing:.15em}.slide h1{font-size:100px;line-height:.92;letter-spacing:-.065em;margin:60px 0 30px;max-width:1260px}.slide p{font-size:32px;line-height:1.45;color:var(--muted);max-width:980px}.broken{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:auto}.broken div,.flow div{background:var(--panel);border:1px solid #405048;padding:28px;font:24px ui-monospace,monospace}.broken div:nth-child(2){transform:translateY(-30px)}.broken b{display:block;color:var(--orange);margin-bottom:18px}.flow{display:grid;grid-template-columns:repeat(7,auto);align-items:center;gap:16px;margin:auto 0}.flow div{min-width:210px}.flow b{display:block;color:var(--green);margin-bottom:16px}.flow i{font-size:42px;color:var(--cyan);font-style:normal}.promise{margin:auto 0}.promise h1{font-size:132px}.cta{font:25px ui-monospace,monospace;color:var(--green);border-top:2px solid var(--green);padding-top:24px;margin-top:auto}.slash{position:absolute;width:760px;height:90px;background:var(--green);right:-210px;top:180px;transform:rotate(-42deg);opacity:.3}.single .deck{display:block;padding:0}.single .slide{display:none}.single .slide.active{display:flex}
</style></head><body><main class="deck">
<section class="slide"><span class="num">01 / CONTEXT BREAKS</span><h1>도구를 옮길 때마다<br>생각도 끊긴다.</h1><p>코드, 명령, 질문이 서로 다른 창에 흩어져 있다.</p><div class="broken"><div><b>FILE</b>현재 코드</div><div><b>TERM</b>실행 결과</div><div><b>AI</b>설명부터 다시</div></div></section>
<section class="slide"><span class="num">02 / ONE FLOW</span><h1>문맥을 옮기지 않는다.</h1><div class="flow"><div><b>FILE</b>찾기</div><i>→</i><div><b>TERM</b>실행</div><i>→</i><div><b>AI</b>고치기</div><i>→</i><div><b>SAVE</b>검증</div></div><p>파일 → 터미널 → AI → 저장이 한 창에서 이어진다.</p></section>
<section class="slide"><div class="slash"></div><span class="num">03 / ROTTIE</span><div class="promise"><h1>생각이 끊기기 전에,<br>코드까지.</h1><p>터미널 + 파일 탐색기 + 편집기 + AI 패널.</p></div><div class="cta">ROTTIE / DESKTOP AI IDE / LOCAL FIRST</div></section>
</main><script>const n=Number(location.hash.slice(1));if(n>=1&&n<=3){document.body.classList.add("single");document.querySelectorAll(".slide")[n-1].classList.add("active")}</script></body></html>
