<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ops Card Slide</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:13px ui-monospace,monospace}.card{width:min(760px,100%);background:var(--card);border:1px solid #455149;padding:22px}.head{display:flex;justify-content:space-between;align-items:end}.head h1{font:400 34px Arial,sans-serif;margin:8px 0}.head small{color:var(--dim)}.active{color:var(--ok);font-size:22px}.workers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.worker{padding:16px;background:var(--inner);border-top:3px solid var(--ok)}.worker:nth-child(2){border-color:#64b6a5}.worker:nth-child(3){border-color:var(--warn)}.worker span{display:block;color:var(--dim);margin-top:16px}.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.signal{border:1px solid #455149;padding:13px}.signal b{float:right;font-size:20px}.signal:nth-child(1) b{color:var(--warn)}.signal:nth-child(2) b{color:var(--bad)}.signal:nth-child(3) b{color:var(--ok)}.card:focus-visible{outline:3px solid var(--ok);outline-offset:4px}@media(max-width:520px){.head{display:grid}.workers,.signals{grid-template-columns:1fr}.worker span{margin-top:6px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><article class="card" tabindex="0"><header class="head"><div><small>RUN / design-skill-eval</small><h1>한 장에 한 신호.</h1></div><b class="active">3 / 5 active</b></header><section class="workers"><div class="worker"><b>frontend-design</b><span>hero</span></div><div class="worker"><b>canvas-design</b><span>poster</span></div><div class="worker"><b>web-design-reviewer</b><span>audit</span></div></section><section class="signals"><div class="signal">검수 대기<b>2</b></div><div class="signal">경고<b>1</b></div><div class="signal">완료<b>7</b></div></section></article></body></html>
