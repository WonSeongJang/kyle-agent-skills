<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rottie Run Card</title><style>
:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25);--cyan:oklch(78% .10 220);--line:oklch(32% .02 160/.55)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:13px/1.55 ui-monospace,"SF Mono",monospace}.card{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px}.head{display:flex;justify-content:space-between;gap:16px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:16px}.kicker{color:var(--dim);font-size:11px;letter-spacing:.1em}.head h1{font-size:17px;margin:4px 0 0}.status{color:var(--ok);background:oklch(80% .17 150/.1);border:1px solid oklch(80% .17 150/.3);padding:6px 8px;white-space:nowrap}.workers{display:grid;gap:1px;background:var(--line);margin:16px 0;border:1px solid var(--line)}.worker{display:grid;grid-template-columns:18px 1fr auto;gap:10px;background:var(--inner);padding:12px}.dot{width:8px;height:8px;background:var(--ok);margin-top:6px}.worker:nth-child(2) .dot{background:var(--cyan)}.worker:nth-child(3) .dot{background:var(--warn)}.role{color:var(--dim)}.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.signal{background:var(--inner);padding:12px;border-top:2px solid var(--line)}.signal b{display:block;font-size:22px;margin-top:4px}.signal.wait b{color:var(--warn)}.signal.alert b{color:var(--bad)}.signal.done b{color:var(--ok)}.card:focus-visible{outline:2px solid var(--ok);outline-offset:3px}@media(max-width:520px){body{padding:12px}.head{display:grid}.workers .worker{grid-template-columns:18px 1fr}.role{grid-column:2}.signals{grid-template-columns:1fr}.signal{display:flex;justify-content:space-between;align-items:center}.signal b{margin:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><article class="card" tabindex="0"><header class="head"><div><div class="kicker">RUN / DESIGN-SKILL-EVAL</div><h1>디자인 스킬 실사용 평가</h1></div><div class="status">3 / 5 active</div></header><section class="workers" aria-label="작업자"><div class="worker"><i class="dot"></i><strong>frontend-design</strong><span class="role">hero</span></div><div class="worker"><i class="dot"></i><strong>canvas-design</strong><span class="role">poster</span></div><div class="worker"><i class="dot"></i><strong>web-design-reviewer</strong><span class="role">audit</span></div></section><section class="signals" aria-label="최근 신호"><div class="signal wait"><span>검수 대기</span><b>2</b></div><div class="signal alert"><span>경고</span><b>1</b></div><div class="signal done"><span>완료</span><b>7</b></div></section></article></body></html>
