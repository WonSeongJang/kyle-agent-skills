<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taste Ops Card</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25);--cyan:oklch(78% .10 220)}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:24px;font-family:ui-monospace,monospace}.card{width:min(760px,100%);display:grid;grid-template-columns:90px 1fr;border:1px solid #475149;background:var(--card);box-shadow:12px 12px 0 #0b100d}.rail{background:var(--ok);color:#0d160f;padding:14px;writing-mode:vertical-rl;font-weight:900;letter-spacing:.12em}.main{padding:20px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #475149;padding-bottom:16px}.top h1{font-size:16px;margin:4px 0}.top small{color:var(--dim)}.count{font-size:26px;color:var(--ok)}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.person{background:var(--inner);padding:12px;border-top:3px solid var(--cyan)}.person:nth-child(2){border-color:var(--ok)}.person:nth-child(3){border-color:var(--warn)}.person span{display:block;color:var(--dim);font-size:11px;margin-top:6px}.signals{display:flex;gap:8px}.signals b{flex:1;padding:12px;background:var(--inner)}.signals i{font-style:normal;float:right}.wait i{color:var(--warn)}.alert i{color:var(--bad)}.done i{color:var(--ok)}.card:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}@media(max-width:540px){.card{grid-template-columns:1fr}.rail{writing-mode:initial}.people{grid-template-columns:1fr}.signals{display:grid}.top{align-items:end}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><article class="card" tabindex="0"><div class="rail">CONTROL / LIVE</div><div class="main"><header class="top"><div><small>RUN / design-skill-eval</small><h1>NO TEMPLATE. ONLY SIGNAL.</h1></div><strong class="count">3 / 5 active</strong></header><section class="people"><div class="person">frontend-design<span>LANDING / ACTIVE</span></div><div class="person">canvas-design<span>POSTER / ACTIVE</span></div><div class="person">web-design-reviewer<span>AUDIT / ACTIVE</span></div></section><section class="signals"><b class="wait">검수 대기 <i>2</i></b><b class="alert">경고 <i>1</i></b><b class="done">완료 <i>7</i></b></section></div></article></body></html>
