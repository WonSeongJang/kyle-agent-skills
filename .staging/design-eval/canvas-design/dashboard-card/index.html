<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Card Fixture</title><style>:root{color-scheme:dark;--bg:oklch(14% .012 160);--card:oklch(19% .016 160);--inner:oklch(23% .018 160);--text:oklch(88% .02 150);--dim:oklch(64% .02 150);--ok:oklch(80% .17 150);--warn:oklch(80% .13 85);--bad:oklch(72% .15 25)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:13px ui-monospace,monospace}.card{width:min(700px,100%);background:var(--card);border:1px solid #465148;padding:20px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:280px;height:18px;background:var(--ok);right:-80px;top:40px;transform:rotate(-38deg);opacity:.45}.top{position:relative;border-bottom:1px solid #465148;padding-bottom:16px}.top small{color:var(--dim)}.top h1{font-size:26px;margin:6px 0}.top b{color:var(--ok)}.workers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0;position:relative}.worker{min-height:120px;background:var(--inner);padding:12px;display:flex;flex-direction:column;justify-content:space-between}.worker span{color:var(--dim)}.signals{display:flex;gap:8px}.signal{flex:1;border:1px solid #465148;padding:12px}.signal b{font-size:22px;float:right}.signal:nth-child(1) b{color:var(--warn)}.signal:nth-child(2) b{color:var(--bad)}.signal:nth-child(3) b{color:var(--ok)}.card:focus-visible{outline:3px solid var(--ok);outline-offset:4px}@media(max-width:520px){.workers{grid-template-columns:1fr}.worker{min-height:74px}.signals{display:grid}.top h1{font-size:21px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><article class="card" tabindex="0"><header class="top"><small>RUN / design-skill-eval</small><h1>흐름의 잔상 / LIVE</h1><b>3 / 5 active</b></header><section class="workers"><div class="worker"><b>frontend-design</b><span>hero</span></div><div class="worker"><b>canvas-design</b><span>poster</span></div><div class="worker"><b>web-design-reviewer</b><span>audit</span></div></section><section class="signals"><div class="signal">검수 대기<b>2</b></div><div class="signal">경고<b>1</b></div><div class="signal">완료<b>7</b></div></section></article></body></html>
