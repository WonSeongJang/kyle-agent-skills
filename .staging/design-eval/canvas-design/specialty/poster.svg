  <text x="88" y="640" font-size="30" fill="#9baaa0">파일을 찾고, 명령을 실행하고, AI와 고친다.</text>
  <text x="88" y="684" font-size="30" fill="#9baaa0">흩어진 개발 작업을 한 창에 잇습니다.</text>
